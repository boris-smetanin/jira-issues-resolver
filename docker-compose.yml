# Local development. `docker compose up` brings up Postgres + two app
# services (server on :3001, web on :3000) with live reload — host file
# edits are picked up by tsx watch / vite via the bind mount.
#
# For the production-shape single-container run, use docker-compose.prod.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build

services:
  server:
    container_name: server
    build:
      context: .
      target: dev
    command: ["pnpm", "--filter", "@jir/server", "dev"]
    restart: unless-stopped
    # Loads MASTER_KEY (and anything else the user has in .env) into the
    # container. `environment:` below overrides specific keys for the compose
    # network — DATABASE_URL must point to `postgres` (service name), not
    # localhost as in the host-side .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://jir:jir@postgres:${POSTGRES_PORT:-5432}/jir
      PORT: "${SERVER_PORT:-3001}"
      DATA_DIR: /data
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${SERVER_PORT:-3001}:${SERVER_PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/shared/node_modules
      - /app/server/node_modules
      - /app/web/node_modules
      - jir-data:/data
      # Mount host Docker socket for slice 0011 (container-mode Sandcastle).
      # Trade-off: the orchestrator container can control the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: web
    build:
      context: .
      target: dev
    command: ["pnpm", "--filter", "@jir/web", "dev"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_TARGET: http://server:${SERVER_PORT:-3001}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/shared/node_modules
      - /app/server/node_modules
      - /app/web/node_modules
    depends_on:
      - server
  postgres:
    container_name: postgres
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jir}
      POSTGRES_DB: ${POSTGRES_DB:-jir}
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - jir-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jir -d jir"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jir-pg:
  jir-data:
